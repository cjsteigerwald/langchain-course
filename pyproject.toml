[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christopher Steigerwald", email = "cjsteigerwald@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "black>=26.10.1",
    "deepagents>=0.7.32",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course = "langchain_course.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
